[package]
name = "civicsense-data-pack"
version = "0.1.0"
description = "YOLO training datasets and field-validation ground truth for CivicSense, with schema validators and public-dataset aggregation tooling"
authors = ["Arpan Pathak <arpanpathak1996@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/arpanpathak/driving-civic-sense-data-crowd"
homepage = "https://github.com/arpanpathak/driving-civic-sense-data-crowd"
keywords = ["computer-vision", "dataset", "yolo", "adas", "ground-truth"]
categories = ["development-tools::profiling", "multimedia::images"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"

# A single binary crate exposing subcommands for validating the dataset
# layouts CivicSense consumes (training split + ground-truth records).
[[bin]]
name = "civicsense-data"
path = "src/bin/civicsense-data.rs"
